<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELODIE — 439 East 77th Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0d0b09; --ivory:#f3efe7; --ivory-dim:#c9c2b4; --gold:#b99b5f; --gold-hi:#e5cf9a;
  --aub:#2b1a22; --serif:'Playfair Display',Didot,serif; --sans:'Inter',Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);color:var(--ivory);font-family:var(--sans);overflow:hidden}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.brand{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:18px 22px;z-index:30;pointer-events:none;mix-blend-mode:difference}
.brand .logo{font-family:var(--serif);letter-spacing:.42em;font-size:15px;color:#fff}
.brand .addr{font-size:10px;letter-spacing:.3em;color:#fff;font-weight:300}
/* ---------- TOWER ---------- */
#towerStage{position:absolute;inset:0;overflow:hidden;background:#111}
#towerBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(28px) brightness(.42);transform:scale(1.15)}
#towerImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
  transition:transform 1.2s cubic-bezier(.6,.02,.2,1),opacity .8s ease;will-change:transform}
#towerVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.34),rgba(10,8,6,0) 26%,rgba(10,8,6,0) 62%,rgba(10,8,6,.52));pointer-events:none;z-index:2}
#bandZone{position:absolute;z-index:5;touch-action:none;cursor:pointer}
#band{position:absolute;left:0;right:0;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(229,207,154,.12) 0%,rgba(229,207,154,.5) 50%,rgba(229,207,154,.12) 100%);
  border-top:2px solid rgba(229,207,154,.95);border-bottom:2px solid rgba(229,207,154,.95);box-shadow:0 0 24px rgba(229,207,154,.35) inset;
  transition:opacity .25s ease;z-index:6}
#bandRail{position:absolute;width:1px;background:rgba(229,207,154,.55);z-index:6;pointer-events:none}
#floorTag{position:absolute;z-index:7;pointer-events:none;opacity:0;transition:opacity .25s ease;
  font-size:10px;letter-spacing:.32em;color:var(--gold-hi);padding:6px 10px;border:1px solid rgba(229,207,154,.5);
  background:rgba(13,11,9,.72);backdrop-filter:blur(3px)}
#towerHint{position:absolute;left:0;right:0;bottom:9vh;text-align:center;z-index:8;pointer-events:none;
  font-size:10px;letter-spacing:.38em;color:var(--ivory-dim);text-transform:uppercase;
  transition:opacity .5s ease}
#towerPanel{position:absolute;z-index:9;background:rgba(13,11,9,.78);backdrop-filter:blur(10px);
  border:1px solid rgba(185,155,95,.35);padding:20px 22px;width:min(320px,86vw);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
#towerPanel.on{opacity:1;pointer-events:auto;transform:none}
#towerPanel .lvl{font-family:var(--serif);font-size:44px;line-height:1;color:var(--ivory);font-variant-numeric:tabular-nums}
#towerPanel .lvl small{font-size:12px;letter-spacing:.3em;color:var(--gold);display:block;margin-bottom:6px;font-family:var(--sans)}
#towerPanel .urow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid rgba(185,155,95,.18);font-size:12px}
#towerPanel .urow b{font-weight:500;color:var(--gold-hi);letter-spacing:.08em}
#towerPanel .urow span{color:var(--ivory-dim);font-weight:300;text-align:right}
#towerPanel .cta{margin-top:12px;font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
@media (min-width:821px){ #towerPanel{right:5vw;top:50%;margin-top:-140px} }
@media (max-width:820px){ #towerPanel{left:4vw;right:4vw;bottom:3.5vh;width:auto} #towerPanel .lvl{font-size:34px} }
/* ---------- FLOOR ---------- */
#floorView{align-items:center;justify-content:flex-start;overflow-y:auto;padding:96px 5vw 40px}
#floorView .fh{width:100%;max-width:1060px;display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid rgba(185,155,95,.3);padding-bottom:16px}
#floorView h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,52px)}
#floorView h2 small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.34em;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.ucards{width:100%;max-width:1060px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:26px}
.ucard{border:1px solid rgba(185,155,95,.3);background:rgba(255,255,255,.02);padding:22px;cursor:pointer;transition:border-color .25s,background .25s}
.ucard:hover,.ucard:active{border-color:var(--gold-hi);background:rgba(185,155,95,.07)}
.ucard .un{font-family:var(--serif);font-size:30px;color:var(--ivory)}
.ucard .us{margin-top:8px;font-size:12px;color:var(--ivory-dim);line-height:1.8;font-weight:300}
.ucard .up{margin-top:12px;font-size:13px;letter-spacing:.12em;color:var(--gold-hi)}
.back{align-self:flex-start;margin-bottom:26px;background:none;border:1px solid rgba(185,155,95,.4);color:var(--gold);
  font-family:var(--sans);font-size:10px;letter-spacing:.3em;padding:12px 20px;cursor:pointer;text-transform:uppercase}
.back:active{background:rgba(185,155,95,.12)}
/* ---------- UNIT ---------- */
#unitView{overflow:hidden}
#uHead{padding:84px 5vw 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 26px;z-index:5}
#uHead .un{font-family:var(--serif);font-size:clamp(28px,5vw,42px);font-weight:400}
#uHead .um{font-size:11px;letter-spacing:.18em;color:var(--ivory-dim);font-weight:300}
#uTabs{display:flex;gap:0;padding:0 5vw;z-index:5;border-bottom:1px solid rgba(185,155,95,.25)}
#uTabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--ivory-dim);
  font-family:var(--sans);font-size:10px;letter-spacing:.18em;padding:12px 10px;cursor:pointer;text-transform:uppercase}
#uTabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold-hi)}
.pane{flex:1;position:relative;display:none;min-height:0}
.pane.on{display:block}
#dollCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#dollNote{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;font-size:9px;letter-spacing:.24em;color:#e8e2d4;pointer-events:none;text-transform:uppercase;padding:8px 16px;background:rgba(13,11,9,.68);border:1px solid rgba(185,155,95,.25)}
#roomTip{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.22em;color:var(--gold-hi);
  background:rgba(13,11,9,.7);padding:7px 14px;border:1px solid rgba(185,155,95,.4);opacity:0;transition:opacity .2s;pointer-events:none;text-transform:uppercase;white-space:nowrap}
#rendersPane{overflow:hidden}
.rslide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;display:flex;align-items:center;justify-content:center;background:#000}
.rslide.on{opacity:1}
.rslide img{width:100%;height:100%;object-fit:cover}
.rcap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);
  font-size:10px;letter-spacing:.2em;color:var(--ivory-dim);text-transform:uppercase}
.rcap b{color:var(--gold-hi);font-weight:500}
.minimap{position:absolute;left:12px;bottom:52px;z-index:5;background:rgba(13,11,9,.72);border:1px solid rgba(185,155,95,.4);padding:8px;backdrop-filter:blur(4px)}
.rnav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;background:rgba(13,11,9,.55);border:1px solid rgba(185,155,95,.4);
  color:var(--gold-hi);width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer}
#rPrev{left:10px}#rNext{right:10px}
#planPane{overflow-y:auto;padding:22px 5vw 40px}
#planImg{width:100%;max-width:980px;display:block;margin:0 auto;border:1px solid rgba(185,155,95,.3);background:#fff}
.specTable{max-width:980px;margin:22px auto 0;border-top:1px solid rgba(185,155,95,.3)}
.specTable .sr{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid rgba(185,155,95,.15);font-size:12px}
.specTable .sr b{font-weight:500;color:var(--ivory)}
.specTable .sr span{color:var(--ivory-dim);font-weight:300;text-align:right}
.srcNote{max-width:980px;margin:14px auto 0;font-size:9px;letter-spacing:.22em;color:rgba(201,194,180,.6);text-transform:uppercase;line-height:1.9}
#zoomFade{position:fixed;inset:0;background:var(--ink);z-index:60;pointer-events:none;opacity:0;transition:opacity .55s ease}
#dollMode{position:absolute;top:10px;right:12px;z-index:6;display:flex;gap:6px}
#dollMode button{font:600 10px/1 Montserrat,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e5cf9a;background:rgba(13,11,9,.72);border:1px solid rgba(185,155,95,.45);padding:9px 11px;cursor:pointer}
#dollMode button.on{background:#b99b5f;color:#131110;border-color:#b99b5f}
</style>
</head>

}

/* ================= TOWER ================= */
var tImg=document.getElementById("towerImg"), bandZone=document.getElementById("bandZone"),
    band=document.getElementById("band"), rail=document.getElementById("bandRail"),
    tag=document.getElementById("floorTag"), panel=document.getElementById("towerPanel"),
    hint=document.getElementById("towerHint"), stage=document.getElementById("towerStage");
tImg.src=HERO;
document.getElementById("towerBg").src=HERO;
var selFloor=0, bRect=null;
function fitMode(){ return "contain" }
function imgRect(){
  var vw=stage.clientWidth, vh=stage.clientHeight, iw=tImg.naturalWidth||1500, ih=tImg.naturalHeight||1970;
  var contain=fitMode()==="contain";
  var s=contain?Math.min(vw/iw,vh/ih):Math.max(vw/iw,vh/ih), w=iw*s, h=ih*s;
  tImg.style.objectFit=contain?"contain":"cover";
  return {x:(vw-w)/2, y:(vh-h)/2, w:w, h:h}
}
function buildBandZone(){
  var r=imgRect();
  var bx=r.x+r.w*CAL.x0, bw=r.w*(CAL.x1-CAL.x0);
  var by=r.y+r.h*CAL.roof, bh=r.h*(CAL.ground-CAL.roof);
  bRect={x:bx,y:by,w:bw,h:bh,fh:bh/CAL.n};
  bandZone.style.left=bx+"px"; bandZone.style.top=by+"px";
  bandZone.style.width=bw+"px"; bandZone.style.height=bh+"px";
}
window.addEventListener("resize",buildBandZone);
tImg.addEventListener("load",buildBandZone);
function floorFromY(cy){
  if(!bRect) return 0;
  var y=(cy-bRect.y)/bRect.h; if(y<0||y>1) return 0;
  return Math.min(CAL.n, Math.max(1, CAL.n-Math.floor(y*CAL.n)));
}
function paintBand(f){
  selFloor=f;
  if(!f){band.style.opacity=0;tag.style.opacity=0;rail.style.opacity=0;panel.classList.remove("on");hint.style.opacity=1;return}
  hint.style.opacity=0;
  var top=bRect.y+bRect.h-(f)*bRect.fh;
  band.style.left=bRect.x+"px"; band.style.width=bRect.w+"px";
  band.style.top=top+"px"; band.style.height=bRect.fh+"px"; band.style.opacity=1;
  /* rail to panel */
  var desktop=window.innerWidth>820;
  var ry=top+bRect.fh/2;
  rail.style.opacity=1;
  if(desktop){
    rail.style.left=(bRect.x+bRect.w)+"px"; rail.style.top=ry+"px";
    rail.style.width=(window.innerWidth*0.95-320-(bRect.x+bRect.w))+"px"; rail.style.height="1px";
    tag.style.left=(bRect.x+bRect.w+8)+"px"; tag.style.top=(ry-16)+"px";
  }else{
    rail.style.left=bRect.x+"px"; rail.style.top=ry+"px"; rail.style.width="1px"; rail.style.height="1px";
    tag.style.left=(bRect.x+10)+"px"; tag.style.top=(ry-14)+"px";
  }
  tag.style.opacity=1;
  var nm=f===7?"PH":("0"+f).slice(-2);
  tag.textContent="LEVEL "+nm;
  var us=unitsOn(f);
  panel.innerHTML='<div class="lvl"><small>LEVEL</small>'+nm+'</div>'+
    us.map(function(u){var d=UNITS[u];return '<div class="urow"><b>'+u+'</b><span>'+d.beds+' · '+d.sf+' SF · '+d.price+(d.note?'*':'')+'</span></div>'}).join("")+(us.some(function(u){return UNITS[u].note})?'<div style="font-size:9px;letter-spacing:.14em;color:#c9c2b4;margin-top:6px">* '+us.filter(function(u){return UNITS[u].note}).map(function(u){return u+': '+UNITS[u].note}).join(' · ')+'</div>':'')+
    '<div class="cta">Tap to enter this level &rarr;</div>';
  panel.classList.add("on");
}
var bandStartY=null;
bandZone.addEventListener("pointermove",function(e){ if(e.pointerType==="mouse") paintBand(floorFromY(e.clientY)) });
bandZone.addEventListener("pointerdown",function(e){ bandStartY=e.clientY; paintBand(floorFromY(e.clientY)) });
bandZone.addEventListener("pointerup",function(e){
  var f=floorFromY(e.clientY);
  if(f && f===selFloor && Math.abs(e.clientY-bandStartY)<8){ enterFloor(f) }
});
bandZone.addEventListener("pointerleave",function(){ if(matchMedia("(pointer:fine)").matches) paintBand(0) });

function enterFloor(f){
  /* zoom into the band, then crossfade to the floor view */
  var top=bRect.y+bRect.h-f*bRect.fh, cy=top+bRect.fh/2;
  var vw=stage.clientWidth, vh=stage.clientHeight;
  var scale=Math.min(6, vh/(bRect.fh*1.6));
  tImg.style.transformOrigin=((bRect.x+bRect.w/2)/vw*100)+"% "+(cy/vh*100)+"%";
  tImg.style.transform="scale("+scale+")";
  var zf=document.getElementById("zoomFade"); zf.style.opacity=1;
  setTimeout(function(){ go("/floor/"+f); },620);
  setTimeout(function(){ tImg.style.transform=""; zf.style.opacity=0; },1250);
}
function showTower(){
  document.getElementById("towerView").classList.add("on");
  requestAnimationFrame(buildBandZone);
  var bt=(location.hash.match(/bandtest=(\d)/)||[])[1];
  if(bt){ var iv=setInterval(function(){ if(bRect){clearInterval(iv); paintBand(+bt)} },200) }
}

    wrap.rotation.y=rot||0;
    wrap.position.set(cx,0,cz);
    wrap.traverse(function(o){if(o.isMesh){o.castShadow=true;o.receiveShadow=true; if(!walk) o.material=CLAYM;}});
    g.add(wrap);
  }
  (L.furn||[]).forEach(function(f){
    if(ASSETS.ready&&FMODEL[f.k]&&ASSETS.models[FMODEL[f.k]]){
      placeModel(FMODEL[f.k],f.x+f.w/2,f.z+f.dp/2,f.rot?Math.PI/2:0,f.w,f.dp);
      if(f.k==="dining"&&ASSETS.models.dchair){
        var cx=f.x+f.w/2, cz=f.z+f.dp/2;
        [[-(f.w/2+1.15),0,Math.PI/2],[f.w/2+1.15,0,-Math.PI/2],[0,-(f.dp/2+1.15),0],[0,f.dp/2+1.15,Math.PI]].forEach(function(c){
          placeModel("dchair",cx+c[0],cz+c[1],c[2],1.7,1.7);
        });
      }
      return;
    }
    if(walk&&ASSETS.ready&&ASSETS.tex.oak&&(f.k==="island"||f.k==="counter"||f.k==="vanity"||f.k==="tub"||f.k==="bed")){
      var rot=f.rot?Math.PI/2:0, hh=FH[f.k]||2;
      function texm(src,rx,rz,rough){
        var t=src.clone(); t.needsUpdate=true; t.repeat.set(Math.max(1,rx/6),Math.max(1,rz/6));
        return new THREE.MeshStandardMaterial({map:t,roughness:rough,metalness:0.02});
      }
      if(f.k==="island"||f.k==="counter"){
        var base=box(f.w,hh-0.18,f.dp,f.x+f.w/2,(hh-0.18)/2+0.1,f.z+f.dp/2,texm(ASSETS.tex.oak,f.w,f.dp,0.6));
        base.rotation.y=rot;
        var top=box(f.w+0.15,0.18,f.dp+0.15,f.x+f.w/2,hh-0.09+0.1,f.z+f.dp/2,texm(ASSETS.tex.marble,f.w,f.dp,0.32));
        top.rotation.y=rot;
      } else if(f.k==="vanity"||f.k==="tub"){
        var vb=box(f.w,hh,f.dp,f.x+f.w/2,hh/2+0.1,f.z+f.dp/2,texm(ASSETS.tex.marble,f.w,f.dp,0.38));
        vb.rotation.y=rot;
      } else { /* bed: wood base + light bedding + headboard */
        var bb2=box(f.w,0.9,f.dp,f.x+f.w/2,0.55,f.z+f.dp/2,texm(ASSETS.tex.oak,f.w,f.dp,0.7));
        bb2.rotation.y=rot;
        var mt=box(f.w-0.3,0.55,f.dp-0.3,f.x+f.w/2,1.25,f.z+f.dp/2,mat(0xe9e4da));
        mt.rotation.y=rot;
        var hb=box(f.w,2.6,0.35,f.x+f.w/2,1.4,f.z+0.2,mat(0xd8cdbb));
        hb.rotation.y=rot;
      }
      return;
    }
    var fm=walk?mat(FMAT[f.k]||0xe8e2d6):CLAYM; /* uniform clay in dollhouse orbit */
    var b=box(f.w,FH[f.k]||2,f.dp,f.x+f.w/2,(FH[f.k]||2)/2+0.1,f.z+f.dp/2,fm);
    b.rotation.y=(f.rot?Math.PI/2:0);
    if(f.k==="sofa"){ var back=box(f.w,1.1,0.7,f.x+f.w/2,2.6+0.55,f.z+0.35,fm); back.rotation.y=b.rotation.y; }
    if(f.k==="bed"){ box(f.w,1.3,0.5,f.x+f.w/2,1.05,f.z+0.25,fm).rotation.y=b.rotation.y; }
  });
  if(walk&&ASSETS.ready&&ASSETS.models.lamp){
    L.rooms.forEach(function(r){
      if(r.w*r.dp<70)return;
      var lp=ASSETS.models.lamp.clone(true);
      var bb3=new THREE.Box3().setFromObject(lp);
      var sc3=1.6/Math.max(bb3.max.x-bb3.min.x,bb3.max.z-bb3.min.z);
      lp.scale.setScalar(sc3);
      lp.position.set(r.x+r.w/2-(bb3.min.x+bb3.max.x)/2*sc3, ch-0.12-bb3.max.y*sc3, r.z+r.dp/2-(bb3.min.z+bb3.max.z)/2*sc3);
      lp.traverse(function(o){if(o.isMesh)o.castShadow=true});
      g.add(lp);
    });
  }
  /* glass + sky backdrop */
  var sky=skyTex();
  (L.glass||[]).forEach(function(gl){
    var z=gl.side==="n"?0:maxZ, x1=gl.a,x2=gl.b;
    var gh=walk?ch-0.6:wallH*0.92;
    var gm=new THREE.MeshStandardMaterial({color:0xcfe2e8,roughness:0.08,metalness:0.1,transparent:true,opacity:walk?0.18:0.42});
    var p=new THREE.Mesh(new THREE.BoxGeometry(x2-x1,gh,0.06),gm);
    p.position.set((x1+x2)/2,gh/2+0.3,z+(gl.side==="n"?0.2:-0.2)); g.add(p);
    var mm=new THREE.MeshStandardMaterial({color:0x4a4238,roughness:0.5,metalness:0.4});
    for(var mx=x1; mx<=x2+0.01; mx+=(x2-x1)/6){
      var mull=new THREE.Mesh(new THREE.BoxGeometry(0.09,gh,0.1),mm);
      mull.position.set(mx,gh/2+0.3,z+(gl.side==="n"?0.2:-0.2)); g.add(mull);
    }
    if(walk){
      var bd=new THREE.Mesh(new THREE.PlaneGeometry(240,80),new THREE.MeshBasicMaterial({map:sky,side:THREE.DoubleSide}));
      bd.position.set((x1+x2)/2,26,z+(gl.side==="n"?-26:26));
      if(gl.side==="n") bd.rotation.y=0; else bd.rotation.y=Math.PI;
      g.add(bd);
    }
  });
  if(walk){ /* ceiling */
    var ce=new THREE.Mesh(new THREE.PlaneGeometry(maxX,maxZ),new THREE.MeshStandardMaterial({color:0xf4efe6,roughness:0.95,side:THREE.DoubleSide}));
    ce.rotation.x=Math.PI/2; ce.position.set(maxX/2,ch,maxZ/2); g.add(ce);
  }
  /* shadow catcher */
  var plane=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.ShadowMaterial({opacity:0.4}));
  plane.rotation.x=-Math.PI/2; plane.position.set(maxX/2,-0.26,maxZ/2); plane.receiveShadow=true; g.add(plane);
  doll.center={x:maxX/2,z:maxZ/2};
  doll.R=Math.sqrt(maxX*maxX+maxZ*maxZ)/2+2;
}
function setupWalk(L){
  var maxZ=L.D;
  L.rooms.forEach(function(r){ var ze=r.z+r.dp; if(ze>maxZ)maxZ=ze; });
  var pts=[];
  L.rooms.forEach(function(r){ if(r.w*r.dp>=14) pts.push({x:r.x+r.w/2,z:r.z+r.dp/2}); });
  L.walls.forEach(function(w){
    (w[4]||[]).forEach(function(gp){
      if(w[0]===w[2]) pts.push({x:w[0],z:w[1]+(gp[0]+gp[1])/2});
      else pts.push({x:w[0]+(gp[0]+gp[1])/2,z:w[1]});
    });
  });
  /* solid wall segments (perimeter + interior minus gaps) */
  var solids=[[0,0,L.W,0],[L.W,0,L.W,maxZ],[L.W,maxZ,0,maxZ],[0,maxZ,0,0]];
  L.walls.forEach(function(w){
    var x1=w[0],z1=w[1],x2=w[2],z2=w[3],horiz=(z1===z2),len=horiz?x2-x1:z2-z1,pos=0;
    (w[4]||[]).slice().sort(function(a,b){return a[0]-b[0]}).forEach(function(gp){
      if(gp[0]>pos) solids.push(horiz?[x1+pos,z1,x1+gp[0],z1]:[x1,z1+pos,x1,z1+gp[0]]);
      pos=gp[1]; });
    if(pos<len) solids.push(horiz?[x1+pos,z1,x1+len,z1]:[x1,z1+pos,x1,z1+len]);
  });
  function cross(a,b,s){
    var d1x=b.x-a.x,d1z=b.z-a.z,d2x=s[2]-s[0],d2z=s[3]-s[1];
    var den=d1x*d2z-d1z*d2x; if(Math.abs(den)<1e-9) return false;
    var t=((s[0]-a.x)*d2z-(s[1]-a.z)*d2x)/den, u=((s[0]-a.x)*d1z-(s[1]-a.z)*d1x)/den;
    return t>0.001&&t<0.999&&u>0.001&&u<0.999;
  }
  var n=pts.length, adj=[]; for(var i=0;i<n;i++) adj[i]=[];
  for(i=0;i<n;i++) for(var j=i+1;j<n;j++){
    var blocked=false;
    for(var k=0;k<solids.length;k++){ if(cross(pts[i],pts[j],solids[k])){blocked=true;break} }
    if(!blocked){ adj[i].push(j); adj[j].push(i); }
  }
  /* start: largest room, facing the farthest waypoint (longest sightline) */
  var start=0, best=-1, cnt=0;
  L.rooms.forEach(function(r){ var a=r.w*r.dp; if(a>=14){ if(a>best){best=a;start=cnt} cnt++; } });
  var far=null, fd=-1;
  pts.forEach(function(p,i){ if(i===start)return; var d=(p.x-pts[start].x)*(p.x-pts[start].x)+(p.z-pts[start].z)*(p.z-pts[start].z); if(d>fd){fd=d;far=p} });
  var yaw=far?Math.atan2(-(far.x-pts[start].x),-(far.z-pts[start].z)):0;
  doll.walk={pts:pts,adj:adj,cur:start,pos:new THREE.Vector3(pts[start].x,0,pts[start].z),yaw:yaw,pitch:-0.04,anim:null};
  /* hotspot markers */
  pts.forEach(function(p,i){
    var ring=new THREE.Mesh(new THREE.RingGeometry(0.8,1.2,28),new THREE.MeshBasicMaterial({color:0xc9a24f,transparent:true,opacity:0.95,side:THREE.DoubleSide}));
    ring.rotation.x=-Math.PI/2; ring.position.set(p.x,0.14,p.z); ring.userData.wp=i;
    var dot=new THREE.Mesh(new THREE.CircleGeometry(0.3,20),new THREE.MeshBasicMaterial({color:0xc9a24f,transparent:true,opacity:0.95,side:THREE.DoubleSide}));
    dot.rotation.x=-Math.PI/2; dot.position.set(p.x,0.14,p.z); dot.userData.wp=i;
    doll.group.add(ring); doll.group.add(dot);
    doll.hot.push(ring); doll.hot.push(dot);
  });
}
function walkPath(to){
  var wk=doll.walk; if(!wk) return;
  var from=wk.cur, n=wk.pts.length;
  var prev=new Array(n).fill(-1), seen=new Array(n).fill(false), q=[from]; seen[from]=true;
  while(q.length){
    var c=q.shift(); if(c===to) break;
    wk.adj[c].forEach(function(m){ if(!seen[m]){seen[m]=true;prev[m]=c;q.push(m)} });
  }
  if(!seen[to]) return;
  var chain=[to]; while(chain[0]!==from) chain.unshift(prev[chain[0]]);
  wk.anim={pts:chain.map(function(i){return wk.pts[i]}),seg:0,t:0};
  wk.cur=to;
}
function tapPick(e){
  if(!doll.cam) return;
  var cv=document.getElementById("dollCanvas"), r=cv.getBoundingClientRect();
  var nx=((e.clientX-r.left)/r.width)*2-1, ny=-((e.clientY-r.top)/r.height)*2+1;
  var rc=new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(nx,ny),doll.cam);
  if(doll.mode==="walk"){
    var hits=rc.intersectObjects(doll.hot.filter(function(h){return h.visible}));
    if(hits.length) walkPath(hits[0].object.userData.wp);
    return;
  }
  var hits2=rc.intersectObjects(doll.pickList);
  var tip=document.getElementById("roomTip");
  if(hits2.length&&hits2[0].object.userData.room){
    var rm=hits2[0].object.userData.room;
    tip.textContent=rm.n+(rm.d?" · "+rm.d:"");
    tip.style.opacity=1;
    clearTimeout(tip._t); tip._t=setTimeout(function(){tip.style.opacity=0},2200);
  }
}

/* ================= MISC ================= */
document.querySelectorAll(".back").forEach(function(b){
  b.addEventListener("click",function(){
    if(b.dataset.go==="tower") go("/tower");
    else if(S.unit) go("/floor/"+UNITS[S.unit].floor);
    else go("/tower");
  });
});
route();
